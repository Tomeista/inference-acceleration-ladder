[project]
name = "ladder"
version = "0.1.0"
description = "GGUF bits-per-weight ladder for Qwen3-8B on llama.cpp. Sibling study to ../bench."
requires-python = ">=3.11"
dependencies = [
    # The load generator, prompt sets, percentile math, gauge sampling and
    # MLflow structure all come from here. This study adds a config schema, a
    # metric-name dialect and a driver; everything that produces a number is
    # bench's.
    "bench",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "mlflow>=2.19",
]

[project.optional-dependencies]
mock = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.uv.sources]
# Editable, and it has to stay editable: bench.classes resolves the frozen
# prompt directory relative to its own __file__, so a copied wheel would read
# prompts out of site-packages and the two studies would silently stop sharing
# a prompt set.
bench = { path = "../bench", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
