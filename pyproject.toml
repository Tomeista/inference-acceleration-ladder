[project]
name = "ladder"
version = "0.1.0"
description = "GGUF bits-per-weight ladder for Qwen3-8B on llama.cpp. Self-contained."
requires-python = ">=3.11"
dependencies = [
    # No dependency on the bench study: the load generator, percentile math,
    # gauge sampling and MLflow structure are vendored into src/ladder/harness/
    # so this repository can be cloned and run on its own. See that package's
    # docstring for what was copied and how to resync it.
    "httpx>=0.28",
    "pyyaml>=6.0",
    "mlflow>=2.19",
]

[project.optional-dependencies]
mock = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
